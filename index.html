<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat</title>
    <!-- Самое надежное подключение базы данных, которое не тормозит -->
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { height: 100%; background-color: #111; color: #fff; overflow: hidden; }
        .screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; padding: 20px; }
        .hidden { display: none !important; }
        .auth-container { background: #222; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        h1 { margin-bottom: 20px; font-size: 24px; color: #0088cc; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #444; border-radius: 8px; background: #333; color: #fff; font-size: 16px; }
        input:focus { border-color: #0088cc; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #0088cc; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #00aacc; }
        .toggle-link { margin-top: 15px; color: #aaa; font-size: 14px; cursor: pointer; text-decoration: underline; }
        #chat-screen { display: flex; flex-direction: column; height: 100vh; background: #181818; }
        #chat-header { background: #222; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; width: 100%; }
        #messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .message { max-width: 75%; padding: 10px 15px; border-radius: 12px; background: #2b2b2b; align-self: flex-start; word-break: break-word; }
        .message.my-msg { background: #0088cc; align-self: flex-end; }
        .msg-author { font-size: 12px; color: #888; margin-bottom: 3px; font-weight: bold; }
        .message.my-msg .msg-author { color: #e0e0e0; }
        .msg-text { font-size: 15px; }
        #chat-form { display: flex; padding: 15px; background: #222; border-top: 1px solid #333; gap: 10px; width: 100%; }
        #msg-input { margin-bottom: 0; flex: 1; }
        #send-btn { width: auto; padding: 0 25px; }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen" class="screen">
        <div class="auth-container">
            <h1 id="auth-title">Anonymous Chat</h1>
            <input type="text" id="username" placeholder="Nickname (только англ буквы)" maxlength="15">
            <input type="password" id="password" placeholder="Пароль (для фиксации ника)">
            <button id="auth-btn">Войти / Создать ник</button>
            <div id="toggle-auth" class="toggle-link">Войти анонимно без регистрации</div>
        </div>
    </div>

    <!-- ЭКРАН ЧАТА -->
    <div id="chat-screen" class="screen hidden">
        <div id="chat-header">
            <div>Вы: <span id="current-user" style="color:#0088cc;"></span></div>
            <button id="logout-btn" style="width:auto; padding: 5px 15px; background:#444; font-size:14px;">Выйти</button>
        </div>
        <div id="messages-container"></div>
        <form id="chat-form">
            <input type="text" id="msg-input" placeholder="Напишите сообщение..." autocomplete="off">
            <button type="submit" id="send-btn">➔</button>
        </form>
    </div>

    <script>
        // --- НАСТРОЙКИ БАЗЫ ДАННЫХ ---
        // Сюда вставь свои данные вместо надписей в кавычках:
        const SUPABASE_URL = "https://СЮДА_ВСТАВЬ_PROJECT_ID.supabase.co";
        const SUPABASE_KEY = "СЮДА_ВСТАВЬ_ANON_PUBLIC_KEY";
        
        // Исправленное создание клиента для CDN версии
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = "";
        let isAnonymousMode = false;

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const authBtn = document.getElementById('auth-btn');
        const toggleAuth = document.getElementById('toggle-auth');
        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');

        usernameInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^a-zA-Z]/g, '');
        });

        toggleAuth.addEventListener('click', () => {
            isAnonymousMode = !isAnonymousMode;
            if (isAnonymousMode) {
                document.getElementById('auth-title').innerText = "Быстрый вход";
                passwordInput.classList.add('hidden');
                authBtn.innerText = "Войти без пароля";
                toggleAuth.innerText = "Нужен постоянный ник с паролем?";
            } else {
                document.getElementById('auth-title').innerText = "Anonymous Chat";
                passwordInput.classList.remove('hidden');
                authBtn.innerText = "Войти / Создать ник";
                toggleAuth.innerText = "Войти анонимно без регистрации";
            }
        });

        authBtn.addEventListener('click', async () => {
            const nick = usernameInput.value.trim();
            const pass = passwordInput.value.trim();

            if (!nick) return alert("Введите ник!");

            if (isAnonymousMode) {
                currentUser = nick + "_anon";
                startChat();
            } else {
                if (!pass) return alert("Придумайте пароль!");

                let { data: user, error } = await supabase.from('users').select('*').eq('username', nick).maybeSingle();

                if (user) {
                    if (user.password === pass) {
                        currentUser = nick;
                        startChat();
                    } else {
                        alert("Этот ник занят или пароль неверный!");
                    }
                } else {
                    const { error: regError } = await supabase.from('users').insert([{ username: nick, password: pass }]);
                    if (regError) return alert("Ошибка регистрации: " + regError.message);
                    currentUser = nick;
                    startChat();
                }
            }
        });

        function startChat() {
            document.getElementById('current-user').innerText = currentUser;
            authScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            loadMessages();
            listenRealtime();
        }

        async function loadMessages() {
            let { data: messages, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(100);

            if (messages) {
                messagesContainer.innerHTML = "";
                messages.forEach(msg => appendMessage(msg));
                scrollToBottom();
            }
        }

        function appendMessage(msg) {
            const msgDiv = document.createElement('div');
            const isMe = msg.author === currentUser;
            msgDiv.className = `message ${isMe ? 'my-msg' : ''}`;
            msgDiv.innerHTML = `<div class="msg-author">${msg.author}</div><div class="msg-text">${escapeHTML(msg.text)}</div>`;
            messagesContainer.appendChild(msgDiv);
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (!text) return;
            msgInput.value = "";
            await supabase.from('messages').insert([{ author: currentUser, text: text }]);
        });

        function listenRealtime() {
            supabase
                .channel('schema-db-changes')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    appendMessage(payload.new);
                    scrollToBottom();
                })
                .subscribe();
        }

        function scrollToBottom() { messagesContainer.scrollTop = messagesContainer.scrollHeight; }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
        document.getElementById('logout-btn').addEventListener('click', () => { location.reload(); });
    </script>
</body>
</html>
